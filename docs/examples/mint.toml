# Example cdk-mintd configuration for a mint attached to the branch processor.
#
# The mint is yours: its seed, database, backups, and keysets are managed by
# you with cdk's own tooling. Only the [[payment_backend]] and
# [grpc_processor] blocks concern the processor — the console's Mint tab
# generates exactly those for your configured unit; copy them from there
# rather than editing by hand.
#
# cdk-mintd 0.18+ stores its configuration in the mint database. This file is
# an import document, not live config:
#   fresh mint:    cdk-mintd config init --new-mint --file mint.toml   (then start it)
#   running mint:  cdk-mintd config export --file mint.toml
#                  …merge your changes…
#                  cdk-mintd config apply --file mint.toml
#                  then restart cdk-mintd
# Editing a mint.toml on disk without `config apply` changes nothing.
#
# Tested with cdk-mintd v0.18.2 (cashubtc/mintd:0.18.2), using
# payment-processor protocol 4.0.0. The Access tab generates the optional
# [auth] section for clear and blind wallet authentication.

[info]
url = "http://localhost:8089"
listen_host = "0.0.0.0"
listen_port = 8089
# Embedded signatory seed. cdk-mintd 0.18 refuses literal secrets — the value
# must be a reference: env:VARIABLE or file:/absolute/path. Anyone with the
# seed can forge the mint's keys; back it up somewhere safe.
mnemonic = "env:CDK_MINTD_MNEMONIC"

[info.http_cache]
backend = "memory"
ttl = 60
tti = 60

# Counter-friendly quote lifetimes. cdk's defaults (3600 s mint, 60 s melt)
# make payouts fragile: a customer's wallet showing a confirmation screen
# misses a 60 s melt window. The processor's self-test warns when it observes
# short lifetimes.
[info.quote_ttl]
mint_ttl = 1800
melt_ttl = 900

[mint_info]
name = "Pecan"
description = "Cashu mint for a custom unit (ora). Wallets create locked quotes; a branch operator settles them by quote id."

[database]
engine = "sqlite"

# Route the custom unit "ora" to the branch processor instead of a Lightning
# backend. The unit must match the processor's configured unit byte-for-byte.
[[payment_backend]]
backend = "grpcprocessor"
unit = "ora"
min_mint = 1
max_mint = 500000
min_melt = 1
max_melt = 500000

[grpc_processor]
supported_units = ["ora"]
address = "127.0.0.1"
port = 50051
# The gRPC link is plaintext: keep it on the same host or a private network.
# Alternatively set tls_dir (and GRPC_TLS_DIR on the processor side) for
# mutual TLS; the console's snippet adjusts automatically.
allow_insecure = true

# Optional, off by default. With 0.18's database-authoritative config, later
# capability changes land via `cdk-mintd config apply` + restart; the
# management RPC (cdk-mint-cli) is the immediate-effect alternative.
#[mint_management_rpc]
#enabled = true
#address = "127.0.0.1"
#port = 8086

[limits]
max_inputs = 1000
max_outputs = 1000
