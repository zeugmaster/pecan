[package]
name = "mintctl"
version = "0.3.1"
edition = "2021"
description = "Pecan — guided installer and operations CLI"
license = "MIT"

# Deliberately NOT a workspace member with processor/: the Docker image build
# copies processor/ as its context and must not see or rebuild this crate.
[workspace]

[dependencies]
anyhow = "1"
# BIP39 seed generation for the bundled mint (12 English words; cdk-mintd
# consumes the mnemonic as a file: secret reference).
bip39 = { version = "2", features = ["rand"] }
clap = { version = "4", features = ["derive", "wrap_help"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
sha2 = "0.10"
rand = "0.8"
tempfile = "3"
time = { version = "0.3", features = ["formatting", "macros"] }
cliclack = "0.3"
console = "0.15"
hickory-resolver = "0.24"

[profile.release]
lto = "thin"
strip = true
opt-level = "s"
