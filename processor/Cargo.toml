[package]
name = "cdk-branch-processor"
version = "0.3.1"
edition = "2021"
rust-version = "1.85.0"
license = "MIT"
description = "cdk payment processor for the 'branch' method (manual cash settlement at a counter) plus a teller/operator web UI. Attaches to one existing cdk-mintd over the stock gRPC payment-processor interface."
repository = "https://github.com/cashubtc/cdk"

[[bin]]
name = "cdk-branch-processor"
path = "src/main.rs"

# ---------------------------------------------------------------------------
# cdk is consumed unmodified from crates.io. The pin is the first release
# containing PR cashubtc/cdk#2295 ("propagate quote_id and pubkey on custom
# mint quotes") — the one upstream change this processor depends on.
#
# The pins are exact (`=`) so the pre-release cannot silently float to a later
# 0.18.x; the payment-processor protocol version check is strict-equality
# ("4.0.0" at this release), so the attached cdk-mintd must run a release that
# speaks the same protocol. Keep in lockstep with COMPATIBLE_CDK_VERSION in
# src/config.rs — CI's pin-check enforces the pair.
# ---------------------------------------------------------------------------
[dependencies]
cdk-common = { version = "=0.18.0-rc.0", default-features = false, features = ["mint", "grpc"] }
cdk-payment-processor = { version = "=0.18.0-rc.0", default-features = false }

anyhow = "1"
async-trait = "0.1"
axum = "0.8.1"
bitcoin_hashes = "0.14.1"
futures = { version = "0.3.28", default-features = false, features = ["async-await"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "signal", "fs", "sync", "time"] }
tokio-stream = { version = "0.1.15", features = ["sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
uuid = { version = "1.17", features = ["v4", "serde"] }

[profile.release]
# keep the image small; the processor is not perf-sensitive
strip = true
